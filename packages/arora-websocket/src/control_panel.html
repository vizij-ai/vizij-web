<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no"
    />
    <title>Vizij Control</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%237c4dff'/></svg>"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, system-ui, BlinkMacSystemFont, sans-serif;
        background: #111;
        color: #e0e0e0;
        overflow-x: hidden;
      }
      header {
        position: sticky;
        top: 0;
        background: #1a1a2e;
        padding: 10px 12px;
        z-index: 10;
        border-bottom: 1px solid #333;
      }
      .status-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        font-size: 13px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dot.off {
        background: #f44336;
      }
      .dot.on {
        background: #4caf50;
      }
      .dot.wait {
        background: #ff9800;
      }
      .conn-row {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .filters {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      input[type="text"],
      input[type="search"] {
        background: #252540;
        color: #eee;
        border: 1px solid #444;
        padding: 7px 10px;
        border-radius: 6px;
        font-size: 15px;
        flex: 1;
        min-width: 100px;
      }
      input[type="search"] {
        min-width: 140px;
      }
      .port {
        color: #777;
        font-size: 14px;
        flex-shrink: 0;
      }
      button {
        padding: 7px 14px;
        border-radius: 6px;
        border: none;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        flex-shrink: 0;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .btn-on {
        background: #4caf50;
        color: #fff;
      }
      .btn-off {
        background: #f44336;
        color: #fff;
      }
      .btn-warn {
        background: #ff9800;
        color: #fff;
      }
      .btn-muted {
        background: #263238;
        color: #e0e0e0;
      }
      nav {
        display: flex;
        background: #16162b;
        overflow-x: auto;
        border-bottom: 2px solid #333;
      }
      .tab {
        padding: 10px 18px;
        cursor: pointer;
        white-space: nowrap;
        color: #777;
        border-bottom: 2px solid transparent;
        font-size: 14px;
        user-select: none;
        transition:
          color 0.15s,
          background-color 0.15s;
      }
      .tab.active {
        color: #eee;
        border-bottom-color: #7c4dff;
      }
      main {
        padding: 10px;
        max-width: 560px;
        margin: 0 auto;
      }
      .tab-pane {
        display: none;
      }
      .tab-pane.active {
        display: block;
      }
      .panel {
        margin-bottom: 6px;
        background: #1a1a30;
        border-radius: 8px;
        overflow: hidden;
      }
      .panel-hdr {
        padding: 10px 14px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        user-select: none;
        font-size: 14px;
      }
      .panel-hdr:active {
        background: #252545;
      }
      .arrow {
        transition: transform 0.15s;
        font-size: 10px;
        color: #666;
      }
      .panel-hdr.shut .arrow {
        transform: rotate(-90deg);
      }
      .panel-body {
        padding: 4px 14px 12px;
      }
      .panel-body.shut {
        display: none;
      }
      .slider-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 6px 0;
      }
      .slider-label {
        font-size: 12px;
        color: #999;
        min-width: 72px;
        text-align: right;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .slider-val {
        font-size: 12px;
        color: #7c4dff;
        min-width: 48px;
        text-align: right;
        font-family: monospace;
      }
      .num-input {
        width: 74px;
        background: #1f1f3a;
        color: #fff;
        border: 1px solid #3f3f66;
        border-radius: 4px;
        padding: 2px 4px;
        font-size: 11px;
      }
      input[type="range"] {
        flex: 1;
        -webkit-appearance: none;
        appearance: none;
        height: 6px;
        background: #333;
        border-radius: 3px;
        outline: none;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #7c4dff;
        cursor: pointer;
      }
      input[type="range"]::-moz-range-thumb {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #7c4dff;
        border: none;
        cursor: pointer;
      }
      .empty {
        text-align: center;
        color: #555;
        padding: 40px 16px;
        font-size: 14px;
      }
      .muted {
        color: #666;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="status-row">
        <span class="dot off" id="dot"></span>
        <span id="stxt">Disconnected</span>
      </div>
      <div class="conn-row">
        <input type="text" id="ip" placeholder="IP address" />
        <span class="port" id="port"></span>
        <button class="btn-on" id="cbtn" onclick="toggleConnection()">
          Connect
        </button>
        <button class="btn-warn" id="rbtn" onclick="invokeReset()" disabled>
          Reset
        </button>
      </div>
      <div class="filters">
        <input
          type="search"
          id="search"
          placeholder="Search controls (namespace/group/path)"
        />
        <button class="btn-muted" id="clear-search" onclick="setSearch('')">
          Clear
        </button>
      </div>
    </header>
    <nav id="tabs"></nav>
    <main id="main"></main>

    <script>
      let ws = null;
      let controls = [];
      let namespaceFilter = "all";
      let searchFilter = "";
      let latestSlots = [];
      let pending = {};
      let flushTimer = null;
      let connectTimeout = null;

      const $ = (id) => document.getElementById(id);
      const wsPort = location.port || "9000";
      const ip = $("ip");
      const dot = $("dot");
      const stxt = $("stxt");
      const cbtn = $("cbtn");
      const rbtn = $("rbtn");
      const searchInput = $("search");

      const numberSuffixes = ["f64", "f32", "i64", "i32", "u64", "u32"];

      ip.value = location.hostname || "";
      $("port").textContent = ":" + wsPort;

      function status(s, t) {
        dot.className = "dot " + s;
        stxt.textContent = t;
      }

      function normalizePath(raw) {
        return String(raw || "")
          .trim()
          .replace(/^\/+/, "")
          .replace(/\/+/g, "/");
      }

      function extractNumeric(obj, fallback = 0) {
        if (obj === null || obj === undefined) {
          return fallback;
        }
        if (typeof obj === "number") {
          return Number.isFinite(obj) ? obj : fallback;
        }
        if (typeof obj === "string") {
          const n = Number.parseFloat(obj);
          return Number.isFinite(n) ? n : fallback;
        }
        if (typeof obj === "object") {
          for (const key of numberSuffixes) {
            if (key in obj) {
              const n = Number.parseFloat(obj[key]);
              return Number.isFinite(n) ? n : fallback;
            }
          }
        }
        return fallback;
      }

      function clampValue(v, min, max) {
        const value = Number.parseFloat(v);
        if (!Number.isFinite(value)) {
          return min;
        }
        return Math.max(min, Math.min(max, value));
      }

      function rangeStep(min, max) {
        const span = max - min;
        if (!Number.isFinite(span) || span <= 0.000001) {
          return 0.0001;
        }
        return span / 2000;
      }

      function deriveControls(slots) {
        const normalized = (slots || []).filter((s) => {
          const kind = s && s.kind ? String(s.kind).toLowerCase() : "";
          return kind === "input" && typeof s.path === "string";
        });

        const out = [];
        const byCanonicalPath = new Map();

        for (const s of normalized) {
          const path = normalizePath(s.path);
          const parts = path.split("/").filter(Boolean);
          if (!path || !parts.length) {
            continue;
          }
          const namespace = parts[0] || "unscoped";
          const group =
            parts.length >= 2
              ? `${parts[0]}/${parts[1]}`
              : parts[0] || "unscoped";
          const track = parts.length >= 3 ? parts.slice(2).join("/") : "";
          const min = extractNumeric(s.min, 0);
          const max = extractNumeric(s.max, min + 1);
          const fallback = extractNumeric(s.default_value, min);
          const control = {
            path,
            namespace,
            group,
            track: track || path,
            min,
            max,
            defaultValue: fallback,
            currentValue: fallback,
            slot: s,
          };
          // Keep one canonical entry per slot path to avoid duplicate controls
          // when the backend returns equivalent paths in different forms.
          if (!byCanonicalPath.has(path)) {
            byCanonicalPath.set(path, control);
            out.push(control);
          }
        }

        out.sort((left, right) =>
          left.namespace === right.namespace
            ? left.group === right.group
              ? left.track.localeCompare(right.track)
              : left.group.localeCompare(right.group)
            : left.namespace.localeCompare(right.namespace),
        );

        return out;
      }

      function filteredControls() {
        const query = searchFilter.trim().toLowerCase();
        return controls.filter((control) => {
          if (
            namespaceFilter !== "all" &&
            control.namespace !== namespaceFilter
          ) {
            return false;
          }
          if (!query) {
            return true;
          }
          const haystack =
            `${control.path} ${control.group} ${control.track} ${control.namespace}`.toLowerCase();
          return haystack.includes(query);
        });
      }

      function buildNamespaceTabs(namespaces) {
        const names = ["all", ...namespaces];
        let tabs = "";
        names.forEach((name) => {
          const label = name === "all" ? "All" : name;
          tabs +=
            '<div class="tab ' +
            (name === namespaceFilter ? "active" : "") +
            '" data-namespace="' +
            name +
            '" onclick="setNamespace(\'' +
            name +
            "')\">" +
            label +
            " (" +
            (name === "all"
              ? controls.length
              : controls.filter((c) => c.namespace === name).length) +
            ")</div>";
        });
        $("tabs").innerHTML = names.length > 1 ? tabs : "";
      }

      function setNamespace(name) {
        namespaceFilter = name;
        rebuildUI();
      }

      function setSearch(value) {
        searchFilter = value || "";
        searchInput.value = searchFilter;
        rebuildUI();
      }

      function setControlValue(path, value) {
        const clamped = Number.isFinite(Number.parseFloat(value))
          ? Number.parseFloat(value)
          : 0;
        const row = $("main").querySelector(
          'input[data-p="' + cssEscape(path) + '"]',
        );
        if (!row) {
          return;
        }
        const slider = row.parentElement.parentElement.querySelector(
          'input[type="range"]',
        );
        const val = clamped.toString();
        if (slider) {
          slider.value = String(clamped);
        }
        row.value = val;
        row.previousElementSibling.textContent = clamped.toFixed(2);
      }

      function cssEscape(value) {
        return String(value).replace(/"/g, '\\"');
      }

      function rebuildUI() {
        const visible = filteredControls();
        const namespaces = Array.from(
          new Set(controls.map((c) => c.namespace)),
        ).sort((a, b) => a.localeCompare(b));

        buildNamespaceTabs(namespaces);

        if (!controls.length) {
          $("main").innerHTML =
            '<div class="empty">No input controls found.<br/>Make sure a model is loaded and published.</div>';
          return;
        }
        if (!visible.length) {
          $("main").innerHTML =
            '<div class="empty">No matching controls. Try a different filter.</div>';
          return;
        }

        const byNamespace = {};
        visible.forEach((control) => {
          if (!byNamespace[control.namespace]) {
            byNamespace[control.namespace] = {};
          }
          if (!byNamespace[control.namespace][control.group]) {
            byNamespace[control.namespace][control.group] = [];
          }
          byNamespace[control.namespace][control.group].push(control);
        });

        let mainHTML = "";
        const order =
          namespaceFilter === "all" ? namespaces : [namespaceFilter];
        order.forEach((ns) => {
          const groups = byNamespace[ns];
          if (!groups) {
            return;
          }
          mainHTML += '<section class="tab-pane active" data-ns="' + ns + '">';
          Object.keys(groups)
            .sort((a, b) => a.localeCompare(b))
            .forEach((group) => {
              const rows = groups[group]
                .sort((a, b) => a.track.localeCompare(b.track))
                .map((control) => {
                  const value = control.currentValue;
                  const step = rangeStep(control.min, control.max);
                  return (
                    '<div class="slider-row">' +
                    '<span class="slider-label" title="' +
                    control.track +
                    '">' +
                    control.track +
                    "</span>" +
                    '<input type="range" min="' +
                    control.min +
                    '" max="' +
                    control.max +
                    '" step="' +
                    step +
                    '" value="' +
                    value +
                    '" data-p="' +
                    control.path +
                    '" oninput="onSlide(this)" onchange="onSlide(this)">' +
                    '<input type="number" class="num-input" step="' +
                    step +
                    '" value="' +
                    value +
                    '" data-p="' +
                    control.path +
                    '" oninput="onNumber(this)" onchange="onNumber(this)">' +
                    '<span class="slider-val">' +
                    Number(value).toFixed(2) +
                    "</span>" +
                    '<button class="btn-muted" type="button" onclick="resetOne(\'' +
                    cssEscape(control.path) +
                    "')\">↺</button>" +
                    "</div>"
                  );
                })
                .join("");
              mainHTML +=
                '<div class="panel">' +
                '<div class="panel-hdr" onclick="togglePanel(this)">' +
                "<span>" +
                group.replace(/\//g, " / ") +
                '</span><span class="arrow">▼</span>' +
                "</div>" +
                '<div class="panel-body">' +
                rows +
                "</div>" +
                "</div>";
            });
          mainHTML += "</section>";
        });

        $("main").innerHTML = mainHTML;
        document.querySelectorAll(".tab-pane").forEach((pane) => {
          pane.classList.toggle(
            "active",
            namespaceFilter === "all"
              ? pane === document.querySelector(".tab-pane")
              : pane.dataset.ns === namespaceFilter,
          );
        });
        if (
          namespaceFilter !== "all" &&
          !document.querySelector(".tab-pane.active")
        ) {
          const first = document.querySelector(".tab-pane");
          if (first) {
            first.classList.add("active");
          }
        }
        document.querySelectorAll(".tab").forEach((tab) => {
          tab.classList.toggle(
            "active",
            tab.dataset.namespace === namespaceFilter,
          );
        });
        refreshCurrentValues();
      }

      function togglePanel(hdr) {
        hdr.classList.toggle("shut");
        hdr.nextElementSibling.classList.toggle("shut");
      }

      function refreshCurrentValues() {
        for (const control of controls) {
          const el = document.querySelector(
            'input[data-p="' + cssEscape(control.path) + '"][type="range"]',
          );
          if (el) {
            el.value = control.currentValue;
            const valEl = el.nextElementSibling.nextElementSibling;
            if (valEl && valEl.classList.contains("slider-val")) {
              valEl.textContent = Number(control.currentValue).toFixed(2);
            }
            const numEl = el.nextElementSibling;
            if (numEl && numEl.classList.contains("num-input")) {
              numEl.value = control.currentValue;
            }
          }
        }
      }

      function scheduleFlush() {
        if (flushTimer) {
          return;
        }
        flushTimer = setTimeout(() => {
          flushTimer = null;
          if (!ws || ws.readyState !== 1) {
            return;
          }
          const payload = {};
          for (const path of Object.keys(pending)) {
            payload[path] = { f64: pending[path] };
          }
          const keys = Object.keys(payload);
          if (!keys.length) {
            return;
          }
          ws.send(JSON.stringify({ type: "set_slot_values", values: payload }));
          pending = {};
        }, 25);
      }

      function setControlNumeric(controlPath, value) {
        const numeric = Number.parseFloat(value);
        if (!Number.isFinite(numeric)) {
          return;
        }
        const control = controls.find(
          (candidate) => candidate.path === controlPath,
        );
        if (!control) {
          return;
        }
        const clamped = clampValue(numeric, control.min, control.max);
        control.currentValue = clamped;
        const rangeInput = document.querySelector(
          'input[type="range"][data-p="' + cssEscape(controlPath) + '"]',
        );
        if (rangeInput) {
          rangeInput.value = String(clamped);
          const valText = rangeInput.nextElementSibling.nextElementSibling;
          if (valText && valText.classList.contains("slider-val")) {
            valText.textContent = clamped.toFixed(2);
          }
        }
        pending[controlPath] = clamped;
        scheduleFlush();
      }

      function onSlide(el) {
        const path = el.dataset.p;
        const value = Number.parseFloat(el.value);
        if (!path || !Number.isFinite(value)) {
          return;
        }
        const control = controls.find((entry) => entry.path === path);
        if (!control) {
          return;
        }
        const numEl = el.nextElementSibling;
        const valText = numEl.nextElementSibling;
        const clamped = clampValue(value, control.min, control.max);
        control.currentValue = clamped;
        el.value = String(clamped);
        numEl.value = clamped;
        if (valText && valText.classList.contains("slider-val")) {
          valText.textContent = clamped.toFixed(2);
        }
        pending[path] = clamped;
        scheduleFlush();
      }

      function onNumber(el) {
        const path = el.dataset.p;
        const value = Number.parseFloat(el.value);
        if (!path || !Number.isFinite(value)) {
          return;
        }
        const control = controls.find((entry) => entry.path === path);
        if (!control) {
          return;
        }
        const clamped = clampValue(value, control.min, control.max);
        control.currentValue = clamped;
        const sliderEl = document.querySelector(
          'input[type="range"][data-p="' + cssEscape(path) + '"]',
        );
        if (sliderEl) {
          sliderEl.value = String(clamped);
          const valText = sliderEl.nextElementSibling.nextElementSibling;
          if (valText && valText.classList.contains("slider-val")) {
            valText.textContent = clamped.toFixed(2);
          }
        }
        el.value = clamped;
        pending[path] = clamped;
        scheduleFlush();
      }

      function resetOne(rawPath) {
        const path = normalizePath(rawPath);
        const control = controls.find((entry) => entry.path === path);
        if (!control) {
          return;
        }
        setControlNumeric(path, control.defaultValue);
        const row = $("main").querySelector(
          'input[type="range"][data-p="' + cssEscape(path) + '"]',
        );
        if (row) {
          row.parentElement.querySelector(".slider-val").textContent = Number(
            control.defaultValue,
          ).toFixed(2);
          const numInput = row.parentElement.querySelector(".num-input");
          if (numInput) {
            numInput.value = control.defaultValue;
          }
        }
      }

      function invokeReset() {
        if (!ws || ws.readyState !== 1) {
          return;
        }
        ws.send(
          JSON.stringify({
            type: "invoke",
            method: "reset",
            request_id: "reset-" + Date.now(),
          }),
        );
        controls.forEach((control) => {
          setControlNumeric(control.path, control.defaultValue);
          const row = $("main").querySelector(
            'input[type="range"][data-p="' + cssEscape(control.path) + '"]',
          );
          if (row) {
            row.value = control.defaultValue;
            const numInput = row.parentElement.querySelector(".num-input");
            if (numInput) {
              numInput.value = control.defaultValue;
            }
            const valEl = row.parentElement.querySelector(".slider-val");
            if (valEl) {
              valEl.textContent = Number(control.defaultValue).toFixed(2);
            }
          }
        });
        ws.send(
          JSON.stringify({
            type: "get_slot_values",
            slots: controls.map((c) => c.path),
          }),
        );
      }

      function requestValuesForCurrentControls() {
        if (!ws || ws.readyState !== 1 || !controls.length) {
          return;
        }
        const paths = controls.map((c) => c.path);
        ws.send(JSON.stringify({ type: "get_slot_values", slots: paths }));
      }

      function toggleConnection() {
        if (ws && ws.readyState < 2) {
          ws.close();
        } else {
          connect();
        }
      }

      function connect() {
        const host = ip.value.trim();
        if (!host) {
          ip.focus();
          return;
        }
        status("wait", "Connecting...");
        cbtn.disabled = true;
        const url = "ws://" + host + ":" + wsPort;
        ws = new WebSocket(url);
        connectTimeout = setTimeout(() => {
          if (ws && ws.readyState === 0) {
            ws.close();
          }
        }, 10000);
        ws.onopen = () => {
          clearTimeout(connectTimeout);
          status("on", "Connected");
          cbtn.textContent = "Disconnect";
          cbtn.className = "btn-off";
          cbtn.disabled = false;
          rbtn.disabled = false;
          searchInput.value = "";
          ws.send(JSON.stringify({ type: "list_slots" }));
          requestValuesForCurrentControls();
        };
        ws.onmessage = (event) => {
          const message = JSON.parse(event.data);
          if (message.type === "list_slots_resp") {
            latestSlots = message.slots || [];
            controls = deriveControls(latestSlots);
            rebuildUI();
            requestValuesForCurrentControls();
          } else if (message.type === "get_slot_values_resp") {
            const values = message.values || {};
            Object.entries(values).forEach(([path, value]) => {
              const numeric = extractNumeric(value);
              const control = controls.find((entry) => entry.path === path);
              if (!control || !Number.isFinite(numeric)) {
                return;
              }
              control.currentValue = numeric;
            });
            refreshCurrentValues();
          }
        };
        ws.onclose = () => {
          clearTimeout(connectTimeout);
          status("off", "Disconnected");
          cbtn.textContent = "Connect";
          cbtn.className = "btn-on";
          cbtn.disabled = false;
          rbtn.disabled = true;
          ws = null;
          controls = [];
          latestSlots = [];
          rebuildUI();
        };
        ws.onerror = (err) => {
          console.error("[vizij] WebSocket error:", err);
          status("off", "Connection error");
        };
      }

      searchInput.addEventListener("input", (event) => {
        setSearch(event.target.value || "");
      });

      function resetUI() {
        controls = [];
        namespaceFilter = "all";
        searchFilter = "";
        searchInput.value = "";
        latestSlots = [];
        pending = {};
        rebuildUI();
      }

      resetUI();
    </script>
  </body>
</html>
