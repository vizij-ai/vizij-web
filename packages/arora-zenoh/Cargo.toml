[package]
name = "arora-zenoh"
version = "0.1.0"
edition = "2021"
description = "Zenoh interface for the Arora connection protocol"

[dependencies]
arora-connection = { path = "../arora-connection" }
zenoh = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tokio-util = "0.7"
serde_json = "1"
log = "0.4"

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
