name: android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/vizij-standalone
  ANDROID_DIR: apps/vizij-standalone/src-tauri/gen/android

jobs:
  # PRs (and manual runs): build an installable, auto-signed DEBUG APK and run
  # the instrumented launch smoke test on an emulator.
  debug-apk:
    name: Debug APK + emulator smoke test
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - run: echo "NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages

      - name: Build debug APK
        # `-- --no-default-features` drops the desktop-only `ros2` feature
        # (rustdds does not cross-compile to Android); `--features studio-bridge`
        # ships the Studio-connected build (VIZ-67). Zero-config: the published
        # `arora-studio-bridge-client` crate bakes in the public Firebase config
        # and the production bridge endpoint, so nothing is injected here.
        working-directory: ${{ env.APP_DIR }}
        run: pnpm exec tauri android build --debug --apk -- --no-default-features --features studio-bridge

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vizij-standalone-debug-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error

      # --- Emulator smoke test ---
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot."

      # The smoke test is genuinely flaky on the headless software GPU: the
      # emulator intermittently dies with `Failed to find ColorBuffer: N`
      # (swiftshader surface-allocation failure), taking adb offline with it.
      # It is not an app regression, so we retry the emulator up to two times.
      #
      # The retry re-invokes the whole action (a FRESH emulator boot), because a
      # ColorBuffer crash kills the emulator process — retrying against the same
      # dead emulator cannot recover. The per-invocation script
      # (.github/scripts/run-android-smoke.sh) additionally absorbs a transient
      # `adb: device offline` at test start without paying for a full reboot.
      #
      # Shared action inputs (both attempts):
      # - :app scope so only our AppLaunchTest runs (the bundled tauri plugin
      #   libraries ship their own failing ExampleInstrumentedTest).
      # - Universal flavor: it bundles x86_64 and installs on the x86_64 emulator.
      # - The rustBuild* tasks are excluded inside the script (they need a parent
      #   `tauri android build`/`dev` process); the prior "Build debug APK" step
      #   already produced the .so, so the test reuses them.
      - name: Run instrumented smoke test
        id: smoke-1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          script: bash .github/scripts/run-android-smoke.sh

      - name: Run instrumented smoke test (fresh-emulator retry)
        id: smoke-2
        if: steps.smoke-1.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          script: bash .github/scripts/run-android-smoke.sh

      - name: Assert smoke test passed
        if: always()
        run: |
          if [ "${{ steps.smoke-1.outcome }}" = "success" ] || [ "${{ steps.smoke-2.outcome }}" = "success" ]; then
            echo "Emulator smoke test passed (attempt-1=${{ steps.smoke-1.outcome }}, attempt-2=${{ steps.smoke-2.outcome }})."
            exit 0
          fi
          echo "::error::Emulator smoke test failed on all attempts (attempt-1=${{ steps.smoke-1.outcome }}, attempt-2=${{ steps.smoke-2.outcome }})."
          exit 1

  # Pushes to main: build a RELEASE APK. It is signed when the keystore secrets
  # are present, otherwise produced unsigned (the build never fails for lack of
  # a key — see src-tauri/gen/android/app/build.gradle.kts).
  release-apk:
    name: Release APK
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - run: echo "NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages

      - name: Configure release signing (if secrets present)
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEY_BASE64" ]; then
            echo "::warning::ANDROID_KEY_BASE64 not set — the release APK will be UNSIGNED."
            exit 0
          fi
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
          } > keystore.properties
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
          echo "Release signing configured."

      - name: Build release APK
        # Ships the Studio-connected build (`--features studio-bridge`, VIZ-67).
        # Zero-config: the published `arora-studio-bridge-client` crate bakes in
        # the public Firebase config and the production bridge endpoint.
        working-directory: ${{ env.APP_DIR }}
        run: pnpm exec tauri android build --apk -- --no-default-features --features studio-bridge

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: vizij-standalone-release-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
