name: publish-npm

on:
  workflow_dispatch:
  push:
    tags:
      - "npm-utils-v*.*.*"
      - "npm-render-v*.*.*"
      - "npm-animation-react-v*.*.*"
      - "npm-node-graph-react-v*.*.*"
      - "npm-orchestrator-react-v*.*.*"
      - "npm-config-v*.*.*"
      - "npm-rig-v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish_utils:
    if: startsWith(github.ref, 'refs/tags/npm-utils-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package and dependencies
        run: pnpm --filter "@vizij/utils..." run build
      - name: Test package
        run: pnpm --filter "@vizij/utils" run test
      - name: Typecheck package
        run: pnpm --filter "@vizij/utils" run typecheck
      - name: npm pack dry-run
        run: pnpm --filter "@vizij/utils" exec npm pack --dry-run
      - name: Publish @vizij/utils
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: pnpm --filter "@vizij/utils" exec npm publish --access public --provenance

  publish_render:
    if: startsWith(github.ref, 'refs/tags/npm-render-v')
