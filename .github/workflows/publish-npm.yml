name: publish-npm

# Publish any publishable @vizij/* package whose version is not yet on npm.
# The decision is per package against the registry (see
# scripts/publish-unpublished.mjs), so a version bump merged to main publishes
# itself and re-runs are idempotent (already-published versions are skipped).
#
# The workflow file name is load-bearing: each package's npm trusted publisher
# is configured against `publish-npm.yml`. Renaming this file breaks OIDC
# publishing until every trusted publisher is reconfigured.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/publish-npm.yml"
      - "scripts/publish-unpublished.mjs"
      - "scripts/prepare-publish-manifests.mjs"

permissions:
  contents: read
  id-token: write # OIDC — trusted publishing + provenance, no NPM_TOKEN

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      # Trusted publishing needs npm >= 11.5.1; node 24 ships a recent npm but
      # pin the latest to be safe.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Publish unpublished @vizij packages
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: node scripts/publish-unpublished.mjs
