# Deletes vizij-authoring's Firebase Hosting preview channels once nothing needs
# them. preview-authoring.yml opens one channel per PR (`pr-<number>`) on site
# `vizij-workspace`; the site holds a bounded number of live channels, and once
# it is full every new preview fails with HTTP 429 ("channel quota reached").
# A channel's expiry alone does not keep it under that bound, so:
#
# - closing a PR (merged or not) deletes its channel;
# - a manual run (workflow_dispatch) deletes the channel of every PR that is no
#   longer open, which clears channels left from before this workflow existed.

name: preview cleanup (vizij-authoring)

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

concurrency:
  group: preview-authoring-cleanup-${{ github.event.number || 'prune' }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fork PRs get no secrets, and preview-authoring.yml opens no channel for them.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read # the prune run reads each channel's PR state
    env:
      PROJECT: semio-vizij
      SITE: vizij-workspace
    # The Firebase CLI refuses to run outside a directory holding a
    # firebase.json, and the app's is the one naming the site.
    defaults:
      run:
        working-directory: apps/vizij-authoring
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            apps/vizij-authoring/firebase.json
            apps/vizij-authoring/.firebaserc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check for the deploy credential
        id: cred
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEMIO_VIZIJ }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No FIREBASE_SERVICE_ACCOUNT_SEMIO_VIZIJ secret, so no preview channel was deleted."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # The Firebase CLI reads the service account from the file
      # GOOGLE_APPLICATION_CREDENTIALS names; the file lives in the runner's
      # temporary directory, which the runner discards after the job.
      - name: Install the service account
        if: steps.cred.outputs.present == 'true'
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEMIO_VIZIJ }}
        run: |
          umask 077
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      # The site's preview channels as `pr-<number>` names, one per line. The
      # step fails when the CLI does, and logs how many channels it listed.
      - name: List the site's preview channels
        id: list
        if: steps.cred.outputs.present == 'true'
        run: |
          set -euo pipefail
          # The CLI states its error in the JSON it prints, also when it fails.
          if ! npx --yes firebase-tools@latest hosting:channel:list --project "$PROJECT" --site "$SITE" --json > "$RUNNER_TEMP/channels.json"; then
            cat "$RUNNER_TEMP/channels.json"
            exit 1
          fi
          jq -e '.status == "success"' "$RUNNER_TEMP/channels.json" > /dev/null || { cat "$RUNNER_TEMP/channels.json"; exit 1; }
          jq -r '(.result.channels // .result // [])[] | .name | split("/") | last | select(test("^pr-[0-9]+$"))' "$RUNNER_TEMP/channels.json" > "$RUNNER_TEMP/pr-channels.txt"
          echo "The site has $(jq '(.result.channels // .result // []) | length' "$RUNNER_TEMP/channels.json") channels, $(wc -l < "$RUNNER_TEMP/pr-channels.txt") of them PR previews."

      - name: Delete the closed PR's channel
        if: steps.cred.outputs.present == 'true' && github.event_name == 'pull_request'
        env:
          CHANNEL: pr-${{ github.event.number }}
        run: |
          set -euo pipefail
          # A PR that never touched the app has no channel; that is not a failure.
          if grep -qx "$CHANNEL" "$RUNNER_TEMP/pr-channels.txt"; then
            npx --yes firebase-tools@latest hosting:channel:delete "$CHANNEL" --project "$PROJECT" --site "$SITE" --force
          else
            echo "No channel $CHANNEL on $SITE."
          fi

      - name: Delete the channels of PRs no longer open
        if: steps.cred.outputs.present == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r channel; do
            number=${channel#pr-}
            state=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || echo MISSING)
            if [ "$state" = OPEN ]; then
              echo "Keeping $channel: PR $number is open."
            else
              echo "Deleting $channel: PR $number is $state."
              npx --yes firebase-tools@latest hosting:channel:delete "$channel" --project "$PROJECT" --site "$SITE" --force
            fi
          done < "$RUNNER_TEMP/pr-channels.txt"
