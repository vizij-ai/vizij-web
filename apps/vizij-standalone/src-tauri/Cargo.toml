[package]
name = "vizij-standalone"
version = "0.1.0"
description = "A Tauri App with WebSocket control"
authors = ["you"]
edition = "2021"

[lib]
name = "vizij_standalone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arora-connection = { path = "../../../packages/arora-connection" }
arora-websocket = { path = "../../../packages/arora-websocket" }
arora-ros2 = { path = "../../../packages/arora-ros2", optional = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tokio = { version = "1", features = [
  "sync",
  "net",
  "io-util",
  "macros",
  "rt-multi-thread",
] }
tokio-util = "0.7"
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
base64 = "0.22"
tao = "0.30"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Console"] }

[features]
ros2 = ["arora-ros2"]

[dev-dependencies]
ros2-client = "0.8"
rand = "0.9"
tokio = { version = "1", features = ["full"] }
