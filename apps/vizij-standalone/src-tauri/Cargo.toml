[package]
name = "vizij-standalone"
version = "0.1.0"
description = "A Tauri App with WebSocket control"
authors = ["you"]
edition = "2021"

[lib]
name = "vizij_standalone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
arora-connection = { path = "../../../packages/arora-connection" }
arora-websocket = { path = "../../../packages/arora-websocket" }
arora-ros2 = { path = "../../../packages/arora-ros2", optional = true }
# Opt-in (`studio-bridge` feature): the studio-bridge Zenoh device client — the
# same `ZenohDeviceClient` arora uses for its Studio connection — plus arora's
# `Bridge` trait it implements. Both are plain crates.io crates (no artifact
# bindeps), so declaring them optional keeps the default stable build untouched.
# We deliberately do NOT depend on the `arora` engine crate here: its manifest
# (and arora-engine's) carry `artifact = "cdylib"` dev-bindeps that require a
# nightly `-Z bindeps` toolchain even to resolve, which would drag the whole
# stable standalone onto nightly. See the studio-bridge feature notes below.
arora-studio-bridge-client = { version = "3.1.0", optional = true }
arora-bridge = { version = "3", optional = true }
# Install the process-wide rustls crypto provider (ring) the Zenoh/Firebase TLS
# stacks need — matches the provider arora-studio-bridge-client is built against.
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
tauri = { version = "2.10.3", features = [] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-log = "2.8.0"
tokio = { version = "1", features = ["sync", "net", "io-util", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
base64 = "0.22"

# `tao` (windowing) is desktop-only — used solely by `list_displays()` behind
# `#[cfg(desktop)]`. Excluding it from Android keeps the mobile build lean.
[target.'cfg(not(target_os = "android"))'.dependencies]
tao = "0.30"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Console"] }

[features]
default = ["ros2"]
ros2 = ["arora-ros2"]
# Opt-in Studio Bridge (VIZ-67 producer side): build the app so a Semio Studio
# can connect *to* this running standalone and view/drive its live data. Off by
# default — the normal standalone build is unchanged. When on, the Tauri host
# reaches the Studio Bridge outbound (VIZ-13: no inbound WS server / UDP
# discovery needed) via arora's studio-bridge Zenoh device client and attaches
# it to an Arora runtime with `Arora::builder().with_bridge(studio_bridge)`.
#
# Build with it on (plain stable toolchain — no nightly/bindeps needed):
#   cargo build --features studio-bridge
# Zero-config: the client crate (v3.1+) bakes in the Firebase config + bridge
# endpoint. Runtime env overrides: STUDIO_BRIDGE_ENDPOINT (non-production bridge),
# FIREBASE_* (emulator), DEVICE_OWNERS (ownership).
studio-bridge = ["dep:arora-studio-bridge-client", "dep:arora-bridge", "dep:rustls"]

[dev-dependencies]
ros2-client = "0.8"
rand = "0.9"
tokio = { version = "1", features = ["full"] }
