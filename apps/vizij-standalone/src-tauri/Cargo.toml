[package]
name = "vizij-standalone"
version = "0.1.0"
description = "A Tauri App with WebSocket control"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "vizij_standalone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# The device the shell runs beside the page: one `SimpleDataStore` and one
# `arora` run owning the interpreter, the `say` module and every bridge. The
# published crates carry no artifact bindeps, so it builds on stable.
arora-bridge-ws = "7.2"
# The ROS 2 bridge, on DDS or the rmw_zenoh-compatible Zenoh backend (this
# crate's `ros2-dds` / `ros2-zenoh` features). 11.1: a reliable writer's send
# window is `ResourceLimits::max_samples` (8192), not its history depth.
arora-bridge-ros2 = { version = "11.1", optional = true, default-features = false }
# 3.1: the store keeps key meta, which opens the device's inputs.
arora-simple-data-store = "3.1"
arora-types = "3.1"
# The device engine without its `native` feature (no wasmtime, no TUI), the
# core the browser runtime builds on, so the Android targets build. 13.2: the
# device's methods read without a step (`describe_methods`).
arora = { version = "13.2", default-features = false }
# Vizij's graph interpreter and the gaze skill's contract + shipped fragment.
vizij-arora-behavior = "7"
# 7.3: the ROS4HRI profile declares the caption inputs.
vizij-arora-host = "7.3"
# The say module (contract + cloud provider) — the same host module the
# native vizij app registers; the bridges serve it on the action plane.
vizij-arora-tts = "7"
# `studio-bridge` feature: the Studio Zenoh device client, an arora `Bridge`.
arora-studio-bridge-client = { version = "10", optional = true }
# `studio-bridge` feature: the `Bridge` the Studio endpoint implements, the
# streams it relays, and the persisted owner list.
arora-bridge = { version = "6", optional = true }
futures-util = { version = "0.3", optional = true }
serde_json = { version = "1", optional = true }
# The process-wide rustls crypto provider (ring) the Zenoh and Firebase TLS
# stacks need, the one arora-studio-bridge-client is built against.
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
# `studio-bridge` feature: the run's end of the Studio connection implements
# arora's `#[async_trait]` `Bridge`.
async-trait = { version = "0.1", optional = true }
# `studio-bridge` feature: encrypts the persisted refresh token at rest
# (XSalsa20Poly1305), as arora does its saved token.
crypto_secretbox = { version = "0.1.1", optional = true }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-log = "2.10"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync"] }
tokio-util = "0.7"
log = "0.4"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
base64 = "0.23"

# Only `list_displays()`, behind `#[cfg(desktop)]`, uses `tao`.
[target.'cfg(not(target_os = "android"))'.dependencies]
tao = "0.37"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Console"] }

[features]
default = []
# The ROS 2 bridge, for robot deployments (`--features ros2`, or
# `pnpm tauri ... -- --features ros2`), with the ROS4HRI exposure preset: the
# typed face topics, the /skill/look_at and /skill/say actions, the described
# task-run methods as actions, and every key as a data topic under
# `/{ns}/keys/{path}`. `ros2` is the DDS backend (`ros2-dds`); `ros2-zenoh`
# selects the rmw_zenoh-compatible backend. The two are mutually exclusive.
ros2 = ["ros2-dds"]
ros2-dds = ["dep:arora-bridge-ros2", "arora-bridge-ros2/dds"]
ros2-zenoh = ["dep:arora-bridge-ros2", "arora-bridge-ros2/zenoh"]
# Semio Studio: the device registers with Studio, which sees its keys and
# methods and drives it. The run holds a Studio endpoint, and the Zenoh device
# client (`ZenohDeviceClient`) connects outbound on a task of its own, relaying
# Studio's commands to the run and the run's changes to Studio. The client crate
# bakes in the Firebase config and the bridge endpoint; STUDIO_BRIDGE_ENDPOINT,
# DEVICE_OWNERS and FIREBASE_*_EMULATOR_HOST override them at run time.
studio-bridge = [
    "dep:arora-studio-bridge-client",
    "dep:arora-bridge",
    "dep:async-trait",
    "dep:futures-util",
    "dep:serde_json",
    "dep:rustls",
    "dep:crypto_secretbox",
]

[dev-dependencies]
# The skill and Studio tests spawn runs through the interpreter module and read
# the device's built-in keys.
arora-behavior = "9"
# The ROS 2 examples (`publish_slot`, `subscribe_slot`, `list_topics`).
ros2-client = "0.12"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
rand = "0.10"
tokio = { version = "1", features = ["full"] }
# The mock `Bridge` in the studio-bridge tests implements an `#[async_trait]` trait.
async-trait = "0.1"
# The reply channel of an `arora_bridge::BridgeCommand` the Studio tests send.
futures-channel = "0.3"
